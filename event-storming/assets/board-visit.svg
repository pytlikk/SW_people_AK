    <tspan x="1295" dy="14">(dead phone</tspan>
    <tspan x="1295" dy="14">/ low balance)</tspan>
  </text>

  <!-- Row 2 y=178: Commands -->
  <rect x="1215" y="178" width="160" height="70" rx="4" fill="#5B9BD5" stroke="#1F5C99" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#fff">
    <tspan x="1295" y="207">Top-Up</tspan>
    <tspan x="1295" dy="15">at Kiosk</tspan>
  </text>

  <rect x="1385" y="178" width="160" height="70" rx="4" fill="#5B9BD5" stroke="#1F5C99" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#fff">
    <tspan x="1465" y="207">Request Kiosk</tspan>
    <tspan x="1465" dy="15">Reprint</tspan>
  </text>

  <!-- Row 3 y=258: Events -->
  <rect x="1215" y="258" width="160" height="70" rx="4" fill="#FF8C42" stroke="#C45E00" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
    <tspan x="1295" y="281">Kiosk Top-Up</tspan>
    <tspan x="1295" dy="15">Completed</tspan>
  </text>

  <rect x="1385" y="258" width="160" height="70" rx="4" fill="#FF8C42" stroke="#C45E00" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
    <tspan x="1465" y="281">Kiosk Reprint</tspan>
    <tspan x="1465" dy="15">Issued (same QR)</tspan>
  </text>

  <!-- Row 4 y=338: Questions -->
  <rect x="1215" y="338" width="160" height="70" rx="4" fill="#FF6B6B" stroke="#CC0000" stroke-width="1"/>
  <text text-anchor="middle" font-size="10" fill="#fff">
    <tspan x="1295" y="361">Q: Token expiry /</tspan>
    <tspan x="1295" dy="14">no-refund policy?</tspan>
    <tspan x="1295" dy="14">TBD (ADR-001)</tspan>
  </text>

  <rect x="1385" y="338" width="160" height="70" rx="4" fill="#FF6B6B" stroke="#CC0000" stroke-width="1"/>
  <text text-anchor="middle" font-size="10" fill="#fff">
    <tspan x="1465" y="361">Q: Fraud window</tspan>
    <tspan x="1465" dy="14">(reveal to cache</tspan>
    <tspan x="1465" dy="14">write)? TBD</tspan>
  </text>

  <!-- ============================================================ -->
  <!-- PHASE 6: Component Candidates  (x=1515, width=280)          -->
  <!-- ============================================================ -->

  <!-- Row 1 y=98: VA-01 -->
  <rect x="1515" y="98" width="280" height="70" rx="4" fill="#88D498" stroke="#2D7A3A" stroke-width="1"/>
  <text text-anchor="middle" fill="#111">
    <tspan x="1655" y="117" font-size="11" font-weight="bold">VA-01 Token Pool Service</tspan>
    <tspan x="1655" dy="14" font-size="9.5">pool balance; purchase; pack/family-pass SKUs;</tspan>
    <tspan x="1655" dy="13" font-size="9.5">NOT per-attraction tickets from home</tspan>
  </text>

  <!-- Row 2 y=178: VA-02 -->
  <rect x="1515" y="178" width="280" height="70" rx="4" fill="#88D498" stroke="#2D7A3A" stroke-width="1"/>
  <text text-anchor="middle" fill="#111">
    <tspan x="1655" y="197" font-size="11" font-weight="bold">VA-02 Claim Minter</tspan>
    <tspan x="1655" dy="14" font-size="9.5">signs QR payload (attractionId, sig, ts);</tspan>
    <tspan x="1655" dy="13" font-size="9.5">reads live or cached pricing table</tspan>
  </text>

  <!-- Row 3 y=258: VA-03 -->
  <rect x="1515" y="258" width="280" height="70" rx="4" fill="#88D498" stroke="#2D7A3A" stroke-width="1"/>
  <text text-anchor="middle" fill="#111">
    <tspan x="1655" y="277" font-size="11" font-weight="bold">VA-03 Checkpoint Verifier</tspan>
    <tspan x="1655" dy="14" font-size="9.5">local verify; seen-token cache (no outbound HTTP);</tspan>
    <tspan x="1655" dy="13" font-size="9.5">publishes `validated`/`revoked` MQTT</tspan>
  </text>

  <!-- Row 4 y=338: VA-04 -->
  <rect x="1515" y="338" width="280" height="70" rx="4" fill="#88D498" stroke="#2D7A3A" stroke-width="1"/>
  <text text-anchor="middle" fill="#111">
    <tspan x="1655" y="357" font-size="11" font-weight="bold">VA-04 Kiosk Terminal</tspan>
    <tspan x="1655" dy="14" font-size="9.5">top-up; dead-phone reprint (same QR);</tspan>
    <tspan x="1655" dy="13" font-size="9.5">dispute desk; no new claim minted</tspan>
  </text>

</svg>
