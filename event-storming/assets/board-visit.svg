    <tspan x="565" dy="14">(signed payload:</tspan>
    <tspan x="565" dy="14">attractionId + sig)</tspan>
  </text>

  <!-- Row 4 y=338: Event + External -->
  <rect x="315" y="338" width="160" height="70" rx="4" fill="#FF8C42" stroke="#C45E00" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
    <tspan x="395" y="361">Pool Balance</tspan>
    <tspan x="395" dy="14">Decremented</tspan>
    <tspan x="395" dy="14">(burn-on-reveal)</tspan>
  </text>

  <rect x="485" y="338" width="160" height="70" rx="4" fill="#DA8FCA" stroke="#8B3A8B" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
