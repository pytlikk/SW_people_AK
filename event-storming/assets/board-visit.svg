    <tspan x="865" dy="15">(checkpoint camera)</tspan>
  </text>

  <!-- Row 3 y=258: Events -->
  <rect x="615" y="258" width="160" height="70" rx="4" fill="#FF8C42" stroke="#C45E00" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
    <tspan x="695" y="281">Claim Verified</tspan>
    <tspan x="695" dy="14">Locally (no network;</tspan>
    <tspan x="695" dy="14">ADR-002)</tspan>
  </text>

  <rect x="785" y="258" width="160" height="70" rx="4" fill="#FF8C42" stroke="#C45E00" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
    <tspan x="865" y="281">Gate / Enclosure</tspan>
    <tspan x="865" dy="15">Admitted</tspan>
  </text>

  <!-- Row 4 y=338: Event + Question -->
  <rect x="615" y="338" width="160" height="70" rx="4" fill="#FF8C42" stroke="#C45E00" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
    <tspan x="695" y="361">Claim Burned</tspan>
    <tspan x="695" dy="14">(local seen-token</tspan>
    <tspan x="695" dy="14">cache)</tspan>
  </text>

  <rect x="785" y="338" width="160" height="70" rx="4" fill="#FF6B6B" stroke="#CC0000" stroke-width="1"/>
  <text text-anchor="middle" font-size="10" fill="#fff">
    <tspan x="865" y="361">Q: Which of 55</tspan>
    <tspan x="865" dy="14">displays are paid</tspan>
    <tspan x="865" dy="14">checkpoints? TBD</tspan>
  </text>

  <!-- Row 5 y=418: Question -->
  <rect x="615" y="418" width="160" height="70" rx="4" fill="#FF6B6B" stroke="#CC0000" stroke-width="1"/>
  <text text-anchor="middle" font-size="10" fill="#fff">
    <tspan x="695" y="441">Q: Kiosk: paper</tspan>
    <tspan x="695" dy="14">reprint or screen-</tspan>
    <tspan x="695" dy="14">only? TBD</tspan>
  </text>

  <!-- ============================================================ -->
  <!-- PHASE 4: Audit Channel (MQTT)  (col_a x=915, col_b x=1085)  -->
  <!-- ============================================================ -->

  <!-- Row 1 y=98: External -->
  <rect x="915"  y="98" width="160" height="70" rx="4" fill="#DA8FCA" stroke="#8B3A8B" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
    <tspan x="995" y="121">MQTT Broker</tspan>
    <tspan x="995" dy="14">(topology TBD;</tspan>
    <tspan x="995" dy="14">separate ADR)</tspan>
  </text>

  <!-- Row 2 y=178: Events -->
  <rect x="915"  y="178" width="160" height="70" rx="4" fill="#FF8C42" stroke="#C45E00" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
    <tspan x="995" y="201">`validated` MQTT</tspan>
    <tspan x="995" dy="14">Event Published</tspan>
    <tspan x="995" dy="14">(audit + popularity)</tspan>
  </text>

  <rect x="1085" y="178" width="160" height="70" rx="4" fill="#FF8C42" stroke="#C45E00" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
    <tspan x="1165" y="201">`revoked` MQTT</tspan>
    <tspan x="1165" dy="14">Event Published</tspan>
    <tspan x="1165" dy="14">(replay / reject)</tspan>
  </text>

  <!-- Row 3 y=258: External -->
  <rect x="915"  y="258" width="160" height="70" rx="4" fill="#DA8FCA" stroke="#8B3A8B" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
    <tspan x="995" y="281">Popularity</tspan>
    <tspan x="995" dy="14">Aggregator</tspan>
    <tspan x="995" dy="14">(Board P, PM-01)</tspan>
  </text>

  <!-- Row 4 y=338: Questions -->
  <rect x="915"  y="338" width="160" height="70" rx="4" fill="#FF6B6B" stroke="#CC0000" stroke-width="1"/>
  <text text-anchor="middle" font-size="10" fill="#fff">
    <tspan x="995" y="361">MQTT is NOT</tspan>
    <tspan x="995" dy="14">the wallet path</tspan>
    <tspan x="995" dy="14">(ADR-002)</tspan>
  </text>

  <rect x="1085" y="338" width="160" height="70" rx="4" fill="#FF6B6B" stroke="#CC0000" stroke-width="1"/>
  <text text-anchor="middle" font-size="10" fill="#fff">
    <tspan x="1165" y="361">Q: Broker topology</tspan>
    <tspan x="1165" dy="14">and QoS level?</tspan>
    <tspan x="1165" dy="14">TBD</tspan>
  </text>

  <!-- ============================================================ -->
  <!-- PHASE 5: Kiosk Path  (col_a x=1215, col_b x=1385)           -->
  <!-- ============================================================ -->

  <!-- Row 1 y=98: Actor -->
  <rect x="1215" y="98" width="160" height="70" rx="4" fill="#FFD966" stroke="#B8A000" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
