    <tspan x="95" dy="14">(pool currency SKU;</tspan>
    <tspan x="95" dy="14">sizes TBD)</tspan>
  </text>

  <rect x="185" y="178" width="160" height="70" rx="4" fill="#5B9BD5" stroke="#1F5C99" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#fff">
    <tspan x="265" y="201">Choose Family Pass</tspan>
    <tspan x="265" dy="14">(party rules encoded;</tspan>
    <tspan x="265" dy="14">SKU shape TBD)</tspan>
  </text>

  <!-- Row 3 y=258: Events -->
  <rect x="15"  y="258" width="160" height="70" rx="4" fill="#FF8C42" stroke="#C45E00" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
    <tspan x="95" y="287">Token Pool</tspan>
    <tspan x="95" dy="15">Purchased</tspan>
  </text>

  <rect x="185" y="258" width="160" height="70" rx="4" fill="#FF8C42" stroke="#C45E00" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
    <tspan x="265" y="281">Family Pass Created</tspan>
    <tspan x="265" dy="14">(party rules</tspan>
    <tspan x="265" dy="14">encoded)</tspan>
  </text>

  <!-- Row 4 y=338: External + Question -->
  <rect x="15"  y="338" width="160" height="70" rx="4" fill="#DA8FCA" stroke="#8B3A8B" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
    <tspan x="95" y="361">Payment Provider</tspan>
    <tspan x="95" dy="14">/ PCI-scoped</tspan>
    <tspan x="95" dy="14">(not estate SoR)</tspan>
  </text>

  <rect x="185" y="338" width="160" height="70" rx="4" fill="#FF6B6B" stroke="#CC0000" stroke-width="1"/>
  <text text-anchor="middle" font-size="10" fill="#fff">
    <tspan x="265" y="361">Q: Pack sizes and</tspan>
    <tspan x="265" dy="14">home prices?</tspan>
    <tspan x="265" dy="14">TBD (ADR-001)</tspan>
  </text>

  <!-- Row 5 y=418: Question -->
  <rect x="15"  y="418" width="160" height="70" rx="4" fill="#FF6B6B" stroke="#CC0000" stroke-width="1"/>
  <text text-anchor="middle" font-size="10" fill="#fff">
    <tspan x="95" y="441">Q: Family pass party</tspan>
    <tspan x="95" dy="14">rules shape (2+2,</tspan>
    <tspan x="95" dy="14">2+3, etc.)? TBD</tspan>
  </text>

  <!-- ============================================================ -->
  <!-- PHASE 2: App / Wallet  (col_a x=315, col_b x=485)           -->
  <!-- ============================================================ -->

  <!-- Row 1 y=98: Actor -->
  <rect x="315" y="98" width="160" height="70" rx="4" fill="#FFD966" stroke="#B8A000" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
    <tspan x="395" y="127">Actor: Guest</tspan>
    <tspan x="395" dy="15">(app / wallet)</tspan>
  </text>

  <!-- Row 2 y=178: Event + Command -->
  <rect x="315" y="178" width="160" height="70" rx="4" fill="#FF8C42" stroke="#C45E00" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
    <tspan x="395" y="207">Pool Balance</tspan>
    <tspan x="395" dy="15">Available in Wallet</tspan>
  </text>

  <rect x="485" y="178" width="160" height="70" rx="4" fill="#5B9BD5" stroke="#1F5C99" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#fff">
    <tspan x="565" y="207">View Pool</tspan>
    <tspan x="565" dy="15">Balance</tspan>
  </text>

  <!-- Row 3 y=258: Command + Event -->
