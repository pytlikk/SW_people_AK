  <!-- Row 2 y=178: Command + Event -->
  <rect x="615" y="178" width="160" height="70" rx="4" fill="#5B9BD5" stroke="#1F5C99" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#fff">
    <tspan x="695" y="207">Present QR</tspan>
    <tspan x="695" dy="15">at Scanner</tspan>
  </text>

  <rect x="785" y="178" width="160" height="70" rx="4" fill="#FF8C42" stroke="#C45E00" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
