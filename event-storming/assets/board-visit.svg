    <tspan x="395" dy="14">(spend; live price</tspan>
    <tspan x="395" dy="14">applied at mint)</tspan>
  </text>

  <rect x="485" y="258" width="160" height="70" rx="4" fill="#FF8C42" stroke="#C45E00" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
