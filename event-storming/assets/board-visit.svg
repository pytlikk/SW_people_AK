    <tspan x="565" dy="14">(server-side; pricing</tspan>
    <tspan x="565" dy="14">ADR writes it later)</tspan>
  </text>

  <!-- Row 5 y=418: Question -->
  <rect x="315" y="418" width="160" height="70" rx="4" fill="#FF6B6B" stroke="#CC0000" stroke-width="1"/>
  <text text-anchor="middle" font-size="10" fill="#fff">
    <tspan x="395" y="441">Q: Price-table max</tspan>
    <tspan x="395" dy="14">cache age? TBD</tspan>
    <tspan x="395" dy="14">(ADR-001 open)</tspan>
  </text>

  <!-- ============================================================ -->
  <!-- PHASE 3: At Checkpoint  (col_a x=615, col_b x=785)          -->
  <!-- ============================================================ -->

  <!-- Row 1 y=98: Actor -->
  <rect x="615" y="98" width="160" height="70" rx="4" fill="#FFD966" stroke="#B8A000" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
    <tspan x="695" y="127">Actor: Guest</tspan>
    <tspan x="695" dy="15">(at ride / enclosure)</tspan>
