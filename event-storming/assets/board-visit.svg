<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 592" font-family="Arial, Helvetica, sans-serif">

  <!-- Background -->
  <rect width="1900" height="592" fill="#ffffff"/>

  <!-- Key strip background -->
  <rect width="1900" height="46" fill="#f0f0f0"/>

  <!-- Key label -->
  <text x="12" y="29" font-size="11" font-weight="bold" fill="#333">Key:</text>

  <!-- Actor swatch -->
  <rect x="50" y="15" width="18" height="14" rx="2" fill="#FFD966" stroke="#B8A000" stroke-width="0.8"/>
  <text x="74" y="27" font-size="10.5" fill="#333">Actor</text>

  <!-- Command swatch -->
  <rect x="127" y="15" width="18" height="14" rx="2" fill="#5B9BD5" stroke="#1F5C99" stroke-width="0.8"/>
  <text x="151" y="27" font-size="10.5" fill="#333">Command</text>

  <!-- Domain Event swatch -->
  <rect x="243" y="15" width="18" height="14" rx="2" fill="#FF8C42" stroke="#C45E00" stroke-width="0.8"/>
  <text x="267" y="27" font-size="10.5" fill="#333">Domain Event</text>

  <!-- External/Policy swatch -->
  <rect x="381" y="15" width="18" height="14" rx="2" fill="#DA8FCA" stroke="#8B3A8B" stroke-width="0.8"/>
  <text x="405" y="27" font-size="10.5" fill="#333">External / Policy</text>

  <!-- Question/Hotspot swatch -->
  <rect x="520" y="15" width="18" height="14" rx="2" fill="#FF6B6B" stroke="#CC0000" stroke-width="0.8"/>
  <text x="544" y="27" font-size="10.5" fill="#333">Question / Hotspot</text>

  <!-- Component Candidate swatch -->
  <rect x="675" y="15" width="18" height="14" rx="2" fill="#88D498" stroke="#2D7A3A" stroke-width="0.8"/>
  <text x="699" y="27" font-size="10.5" fill="#333">Component Candidate (digitised board only)</text>

  <!-- Title -->
  <text x="950" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Board V - Visit Access / Ticketing</text>
  <text x="950" y="74" text-anchor="middle" font-size="9.5" fill="#666">Digitised event storming | Guest lane | Reconstructed from ADR-001, ADR-002, requirements/ - not a photographed workshop | Component candidates: VA-01..VA-04</text>

  <!-- Phase background bands (y=80 to 592) -->
  <rect x="0"    y="80" width="300" height="512" fill="#FFF9F2"/>
  <rect x="300"  y="80" width="300" height="512" fill="#F2F4FF"/>
  <rect x="600"  y="80" width="300" height="512" fill="#F2FFF4"/>
  <rect x="900"  y="80" width="300" height="512" fill="#FFF2F8"/>
  <rect x="1200" y="80" width="300" height="512" fill="#FFF9F2"/>
  <rect x="1500" y="80" width="400" height="512" fill="#F5F5F5"/>

  <!-- Phase separator lines -->
  <line x1="300"  y1="80" x2="300"  y2="592" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="600"  y1="80" x2="600"  y2="592" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="900"  y1="80" x2="900"  y2="592" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="1200" y1="80" x2="1200" y2="592" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="1500" y1="80" x2="1500" y2="592" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Phase headers -->
  <text x="150"  y="93" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">Pre-Visit</text>
  <text x="450"  y="93" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">App / Wallet</text>
  <text x="750"  y="93" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">At Checkpoint</text>
  <text x="1050" y="93" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">Audit Channel (MQTT)</text>
  <text x="1350" y="93" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">Kiosk Path</text>
  <text x="1700" y="93" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">Component Candidates</text>

  <!-- ============================================================ -->
  <!-- PHASE 1: Pre-Visit  (col_a x=15, col_b x=185)               -->
  <!-- ============================================================ -->

  <!-- Row 1 y=98: Actor -->
  <rect x="15"  y="98" width="160" height="70" rx="4" fill="#FFD966" stroke="#B8A000" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#111">
    <tspan x="95" y="127">Actor:</tspan>
    <tspan x="95" dy="15">Guest</tspan>
  </text>

  <!-- Row 2 y=178: Commands -->
  <rect x="15"  y="178" width="160" height="70" rx="4" fill="#5B9BD5" stroke="#1F5C99" stroke-width="1"/>
  <text text-anchor="middle" font-size="10.5" fill="#fff">
